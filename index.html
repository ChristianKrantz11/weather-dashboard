<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search any city for current weather conditions and a 5-day forecast.">
  <title>Weather Dashboard</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link
    rel="stylesheet"
    href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
    integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf"
    crossorigin="anonymous"/>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header bg-dark text-white text-center py-3 mb-4">
    <h1 class="h2 mb-0">Weather Dashboard</h1>
  </header>

  <main class="container">
    <div class="row">
      <!-- search form and recently searched cities -->
      <aside class="col-lg-4 mb-4">
        <div class="card">
          <div class="card-body">
            <form id="search-form" class="mb-3">
              <label for="search-input" class="h6">Search for a city:</label>
              <div class="input-group">
                <input type="text" class="form-control" id="search-input" placeholder="e.g. Austin" autocomplete="off" required>
                <div class="input-group-append">
                  <button type="submit" class="btn btn-primary" aria-label="Search">
                    <i class="fa fa-search" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
            </form>

            <div class="hide" id="searched-cities-card">
              <h2 class="h6 text-muted">Recent searches</h2>
              <div class="list-group" id="searched-cities-list"></div>
            </div>
          </div>
        </div>
      </aside>

      <section class="col-lg-8" aria-live="polite">
        <p id="message" class="alert alert-info hide" role="status"></p>

        <!-- current weather -->
        <div class="row no-gutters" id="current-weather-conditions"></div>

        <!-- 5-day forecast -->
        <div class="row no-gutters" id="five-day-forecast"></div>
      </section>
    </div>
  </main>

  <footer class="text-center text-muted small py-4">
    Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
